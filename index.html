<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube運用ボード</title>
<style>
:root{
  color-scheme:light;
  --page:#f4f3ef; --surface:#fcfcfb; --sunken:#eeede8;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#86857f; --line:#dfded8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --crit:#d03b3b; --warn:#fab219; --good:#0ca30c;
  --accent:#0b0b0b; --on-accent:#fcfcfb;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#111110; --surface:#1a1a19; --sunken:#242422;
    --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8d8c84; --line:#33332f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --accent:#f0efec; --on-accent:#111110;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
.num{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em;padding:14px 0;white-space:nowrap}
.brand i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--crit);margin-right:8px;transform:rotate(45deg)}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{background:none;border:0;padding:15px 12px 13px;border-bottom:2px solid transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tools{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:8px 0}
.sync{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync[data-s=saving]::before{background:var(--warn)}
.sync[data-s=error]::before{background:var(--crit)}
.sync[data-s=ro]::before{background:var(--ink3)}

main{max-width:1280px;margin:0 auto;padding:24px 20px 64px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:20px;margin-right:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card>h3{font-size:14px;margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.empty{color:var(--ink3);margin:8px 0}
.sub{color:var(--ink3);font-size:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--crit)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--sunken);color:var(--ink);font-weight:700}
.badge{display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink2);white-space:nowrap}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:28px;font-weight:800;line-height:1.25}
.kpi .d{font-size:12px;color:var(--ink3)}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.alert:first-of-type{border-top:0}
.alert .ic{flex:none;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.3}
.alert.crit .ic{color:var(--crit)}
.alert.warn .ic{color:var(--ink);background:var(--warn);border-color:var(--warn);color:#0b0b0b}
.alert b{display:block}
.alert span.m{color:var(--ink2);font-size:13px}

/* schedule list */
.sched{list-style:none;margin:0;padding:0}
.sched li{display:grid;grid-template-columns:92px auto 1fr;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.sched li:first-child{border-top:0}
.kind{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);white-space:nowrap}
.kind::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--k)}
.k-shoot{--k:var(--s1)} .k-edit{--k:var(--s2)} .k-post{--k:var(--s3)}
.link{background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:600}
td.r,th.r{text-align:right}
td.t{white-space:normal;min-width:160px}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunken)}

/* kanban */
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunken);border-radius:10px;padding:10px;min-height:160px}
.col.over{outline:2px solid var(--ink);outline-offset:-2px}
.col h3{font-size:13px;display:flex;justify-content:space-between;margin:2px 4px 10px}
.col h3 span{color:var(--ink3);font-weight:400}
.pc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.pc:hover{border-color:var(--ink3)}
.pc .ti{font-weight:700;margin:4px 0 2px;word-break:break-word}
.pc .me{color:var(--ink2);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.pc .ds{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.pc .ds .kind{font-size:11px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface);text-align:center;font-size:12px;color:var(--ink2);padding:6px 0}
.cal .day{background:var(--surface);min-height:104px;padding:5px}
.cal .day.out{background:var(--page)}
.cal .dn{font-size:12px;color:var(--ink2);display:inline-block;min-width:22px;text-align:center;border-radius:11px;line-height:22px}
.cal .today .dn{background:var(--ink);color:var(--surface);font-weight:700}
.ev{display:flex;gap:5px;align-items:baseline;width:100%;text-align:left;border:0;border-left:3px solid var(--k);background:var(--sunken);border-radius:3px;padding:2px 5px;margin-top:3px;font-size:12px;cursor:pointer;overflow:hidden}
.ev b{flex:none;font-size:11px;color:var(--ink2)}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px}

/* charts */
.chart{position:relative}
.chart svg{display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:11px;fill:var(--ink3)}
.chart .bar{fill:var(--s1)}
.chart .ln{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent}
.chart .hl{fill:var(--ink);opacity:.06}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:6px;padding:5px 9px;font-size:12px;line-height:1.4;max-width:240px;transform:translate(-50%,-100%);z-index:2}
.tip b{display:block;font-size:13px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--ink2);font-size:12px}

/* review */
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv:first-of-type{border-top:0}
.rv .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.rv h4{margin:0;font-size:12px;color:var(--ink2);font-weight:600}
.rv p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h3{font-size:16px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--ink2)}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
label.f textarea{min-height:84px;resize:vertical}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.acts{display:flex;gap:8px;align-items:center;margin-top:4px}
.acts .sp{flex:1}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;margin:0;display:grid;gap:10px}
legend{font-size:12px;color:var(--ink2);padding:0 4px}

body.ro [data-act$="-new"]{display:none}
body.ro .pc{cursor:pointer}
/* start */
.start{max-width:560px;margin:8vh auto 0}
.start h2{font-size:22px;margin-bottom:8px}
.start .btn{padding:10px 16px;margin:6px 8px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;z-index:20;max-width:90vw}
@media (max-width:700px){.rv .cols{grid-template-columns:1fr}.cal .day{min-height:72px}.tools .hide-s{display:none}}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="brand"><i></i>YouTube運用ボード</div>
  <nav id="nav"></nav>
  <div class="tools">
    <span class="sync" id="sync" data-s="ok">保存済み</span>
    <button class="btn sm" data-act="edit" id="editBtn">編集する</button>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast" hidden></div>

<script>
'use strict';
/* ===== 定数 ===== */
const STATUSES=['アイデア','企画確定','撮影済','編集中','投稿予約','公開済'];
const TYPES={normal:'通常',short:'ショート',live:'ライブ'};
const KINDS={shoot:['撮影','撮','shootDate'],edit:['編集','編','editDate'],post:['投稿','投','postDate']};
const VIEWS=[['dash','ダッシュボード'],['plans','企画'],['cal','スケジュール'],['stats','数字'],['an','分析']];
const COLS=['plans','videoStats','channelStats'];
const DOW=['日','月','火','水','木','金','土'];

/* ===== 状態 ===== */
/* ▼ 設定：通常は空のままでOK（URLから自動判定）。独自ドメイン等で動かす場合だけ 'ユーザー名/リポジトリ名' を入れる */
const REPO='';
const DATA_FILE='data.json';
let db=emptyDb(), readOnly=true, token='', sha='', uidMe='', dirty=false, pushing=false, pushTimer=0, rev='';
const LS={get(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const ui={view:'dash',planType:'all',statTab:'video',statType:'all',anType:'all',cal:null};

/* ===== ユーティリティ ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowIso=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const fmtD=s=>{if(!s)return'—';const d=toDate(s);return`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
const fmtDT=s=>{if(!s)return'';const d=new Date(s);return`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const num=v=>v==null?'—':Number(v).toLocaleString('ja-JP');
const pct=v=>v==null?'—':Number(v).toLocaleString('ja-JP',{maximumFractionDigits:1})+'%';
const signed=v=>v==null?'—':(v>0?'+':'')+Number(v).toLocaleString('ja-JP');
const compact=v=>new Intl.NumberFormat('ja-JP',{notation:'compact',maximumFractionDigits:1}).format(v);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const round1=v=>v==null?null:Math.round(v*10)/10;
function emptyDb(){return{plans:[],videoStats:[],channelStats:[]}}
function normalize(o){const d=emptyDb();if(o&&typeof o==='object')for(const k of COLS)if(Array.isArray(o[k]))d[k]=o[k].filter(x=>x&&typeof x==='object'&&x.id);return d}
function toast(msg,ms=3500){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)}
function setSync(s,text){const e=$('#sync');e.dataset.s=s;e.textContent=text}
const plan=id=>db.plans.find(p=>p.id===id);
const typeBadge=t=>`<span class="badge">${TYPES[t]||'通常'}</span>`;
function latestStat(planId){let best=null;for(const s of db.videoStats)if(s.planId===planId&&(!best||s.date>best.date||(s.date===best.date&&(s.updatedAt||'')>(best.updatedAt||''))))best=s;return best}

/* ===== データ：GitHub上の data.json（閲覧は誰でも、編集は鍵を持つ人だけ） ===== */
const nameOf=x=>x||'';
function repoInfo(){if(REPO.includes('/')){const[o,r]=REPO.split('/');return{o,r}}
  const h=location.hostname;if(!h.endsWith('.github.io'))return null;
  const o=h.split('.')[0],r=location.pathname.split('/').filter(Boolean)[0];
  return{o,r:r&&!r.includes('.')?r:h}}
const b64e=str=>{const u=new TextEncoder().encode(str);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)};
async function gh(method,body,raw){const R=repoInfo();if(!R)throw new Error('このページはGitHub Pages上で開いてください');
  const res=await fetch(`https://api.github.com/repos/${R.o}/${R.r}/contents/${DATA_FILE}${method==='GET'?'?t='+Date.now():''}`,{method,cache:'no-store',
    headers:{Authorization:'Bearer '+token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
  if(!res.ok){const e=new Error('GitHub '+res.status);e.status=res.status;throw e}
  return raw?res.text():res.json()}
async function loadPublic(first){ // 閲覧用：公開されている data.json を読む
  try{const res=await fetch(DATA_FILE+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error(res.status);
    const o=JSON.parse((await res.text())||'{}');
    if(first||o.rev!==rev){db=normalize(o);rev=o.rev||'';db.updatedAt=o.updatedAt;db.updatedBy=o.updatedBy;if(first)startApp();else render()}
    if(readOnly)setSync('ro',db.updatedAt?`最終更新 ${fmtDT(db.updatedAt)}`:'閲覧中')}
  catch(e){console.error(e);if(first)message('<p>データ（data.json）を読み込めませんでした。index.html と data.json が同じ場所に置かれているか確認してください。</p>')}}
async function enterEdit(tk,name){ // 編集モード：最新データと更新用の情報をGitHubから取得
  token=tk;
  try{const meta=await gh('GET');const text=await gh('GET',null,true);
    const o=JSON.parse(text||'{}');db=normalize(o);rev=o.rev||'';sha=meta.sha;
    readOnly=false;uidMe=name;LS.set('ytops.token',tk);LS.set('ytops.name',name);setSync('ok','編集モード');render();return true}
  catch(e){console.error(e);token='';
    toast(e.status===401?'鍵（トークン）が正しくないか、期限切れです。':e.status===403||e.status===404?'この鍵ではデータにアクセスできません。鍵の対象リポジトリと権限（Contents: Read and write）を確認してください。':'GitHubに接続できませんでした：'+e.message,8000);return false}}
function exitEdit(){if(dirty||pushing){toast('保存が終わるまでお待ちください');return}
  readOnly=true;token='';LS.set('ytops.token','');render();loadPublic(false);toast('編集を終了しました。このブラウザから鍵を削除しました。')}
function schedulePush(){dirty=true;setSync('saving','保存中…');clearTimeout(pushTimer);pushTimer=setTimeout(push,900)}
async function push(){if(pushing||!dirty)return;pushing=true;dirty=false;
  const out={version:1,rev:uid(),updatedAt:nowIso(),updatedBy:uidMe,...Object.fromEntries(COLS.map(c=>[c,db[c]]))};
  const body=()=>({message:`データ更新（${uidMe||'編集者'}）`,content:b64e(JSON.stringify(out,null,1)),sha});
  try{let r;try{r=await gh('PUT',body())}catch(e){if(e.status!==409&&e.status!==422)throw e;sha=(await gh('GET')).sha;r=await gh('PUT',body())}
    sha=r.content.sha;rev=out.rev;db.updatedAt=out.updatedAt;db.updatedBy=uidMe;
    if(!dirty)setSync('ok','保存済み '+fmtDT(out.updatedAt).split(' ')[1])}
  catch(e){console.error(e);dirty=true;setSync('error','保存エラー');
    toast(e.status===401||e.status===403?'保存できませんでした。鍵（トークン）の期限切れか権限不足です。「編集を終了」して鍵を入れ直してください。':'保存できませんでした。通信状況を確認してください。次の入力時にもう一度保存を試みます。',9000)}
  pushing=false;if(dirty&&$('#sync').dataset.s!=='error')schedulePush()}
function save(col,obj){render();if(readOnly){toast('閲覧モードです。入力するには「編集する」を押してください');return}schedulePush()}
function remove(col,id){db[col]=db[col].filter(x=>x.id!==id);if(!readOnly)schedulePush()}
function dlgEdit(){
  if(!repoInfo()){toast('編集はGitHub Pages上のページでのみ行えます');return}
  openDlg(`<h3>編集モードに入る</h3><p class="sub" style="margin:0">入力するには、GitHubで発行した鍵（アクセストークン）が必要です。鍵はこのブラウザにだけ保存されます。共用のパソコンでは、使い終わったら「編集を終了」を押してください。</p>
    <label class="f">あなたの名前（更新者として記録）<input name="name" maxlength="20" value="${esc(LS.get('ytops.name'))}"></label>
    <label class="f">鍵（アクセストークン）<input name="token" type="password" required autocomplete="off" placeholder="github_pat_…"></label>
    <div class="acts"><span class="sp"></span><button type="button" class="btn" data-act="close">キャンセル</button><button class="btn pri">編集を始める</button></div>`,
    fd=>{enterEdit(fd.get('token').trim(),fd.get('name').trim())})}

/* ===== 起動 ===== */
function message(html){$('#hdr').hidden=true;$('#main').innerHTML=`<div class="card start"><h2>YouTube運用ボード</h2>${html}</div>`}
async function boot(){
  message('<p>読み込み中…</p>');
  await loadPublic(true);
  const tk=LS.get('ytops.token');if(tk&&!$('#hdr').hidden)enterEdit(tk,LS.get('ytops.name'));
  setInterval(()=>{if(readOnly&&!document.hidden)loadPublic(false)},60000);
  window.addEventListener('focus',()=>{if(readOnly)loadPublic(false)});
  window.addEventListener('beforeunload',e=>{if(dirty||pushing){e.preventDefault();e.returnValue=''}})}
function startApp(){
  $('#hdr').hidden=false;
  $('#nav').innerHTML=VIEWS.map(([k,l])=>`<button data-view="${k}">${l}</button>`).join('');
  const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))ui.view=h;
  render()}

/* ===== 画面描画 ===== */
function render(){
  if($('#hdr').hidden)return;
  $('#editBtn').textContent=readOnly?'編集する':'編集を終了';document.body.classList.toggle('ro',readOnly);

function seg(key,opts){return`<div class="seg">${opts.map(([v,l])=>`<button data-seg="${key}" data-val="${v}" aria-pressed="${ui[key]===v}">${l}</button>`).join('')}</div>`}
const TYPE_OPTS=[['all','すべて'],['normal','通常'],['short','ショート'],['live','ライブ']];

/* --- ダッシュボード --- */
function alerts(){const t=today(),out=[];
  for(const p of db.plans){const si=STATUSES.indexOf(p.status);if(si===5)continue;
    if(p.postDate){const d=dayDiff(t,p.postDate);
      if(d<0)out.push({lv:'crit',p,msg:`投稿日（${fmtD(p.postDate)}）を過ぎていますが、公開済になっていません`});
      else if(d<=3&&si<4)out.push({lv:'warn',p,msg:`${d===0?'今日が投稿日':'投稿まであと'+d+'日'}ですが、編集が終わっていません（現在：${p.status}）`})}
    if(p.shootDate&&p.shootDate<t&&si<2)out.push({lv:'warn',p,msg:`撮影日（${fmtD(p.shootDate)}）を過ぎていますが、撮影済になっていません`});
    if(p.editDate&&p.editDate<t&&si<4)out.push({lv:'warn',p,msg:`編集日（${fmtD(p.editDate)}）を過ぎていますが、編集が終わっていません`})}
  return out.sort((a,b)=>(a.lv==='crit'?0:1)-(b.lv==='crit'?0:1))}
function events(from,to){const out=[];for(const p of db.plans)for(const[k,[, ,f]]of Object.entries(KINDS))if(p[f]&&p[f]>=from&&p[f]<=to)out.push({date:p[f],kind:k,p});return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function vDash(){

  const d7=new Date();d7.setDate(d7.getDate()+6);

    ${kpi('総再生数',c?num(c.totalViews):'—',c?(c0&&c.totalViews!=null&&c0.totalViews!=null?`前回から ${signed(c.totalViews-c0.totalViews)}`:`${fmtD(c.date)} 時点`):'　')}
    ${kpi('進行中の企画',active,'企画確定〜投稿予約')}

/* ===== グラフ（SVG） ===== */
function ticks(max){if(!(max>0))max=1;const raw=max/4,p=10**Math.floor(Math.log10(raw)),s=[1,2,2.5,5,10].find(k=>k*p>=raw)*p,n=Math.ceil(max/s-1e-9);return Array.from({length:n+1},(_,i)=>+(i*s).toPrecision(12))}
function chart(el,o){
  if(!el)return;const n=o.values.length;
  if(!n){el.innerHTML='<p class="empty">データがまだありません。</p>';return}
  const W=Math.max(el.clientWidth,280),H=220,m={l:46,r:12,t:10,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const tk=ticks(Math.max(...o.values)),ymax=tk.at(-1),band=iw/n;
  const X=i=>m.l+band*(i+.5),Y=v=>m.t+ih*(1-v/ymax),y0=m.t+ih;
  const ax=o.axis||o.labels.map(l=>o.short===false?l:(l.length>6?l.slice(0,6)+'…':l));
  const step=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(iw/(o.axis?30:84)))));
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.title)}">`;
  for(const t of tk)s+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${m.l-6}" y="${Y(t)+4}" text-anchor="end">${compact(t)}</text>`;
  for(let i=0;i<n;i++){s+=`<rect class="hit" data-i="${i}" x="${m.l+band*i}" y="${m.t}" width="${band}" height="${ih}"/>`;
    if(i%step===0)s+=`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(ax[i])}</text>`}
  if(o.type==='bar'){const bw=Math.max(2,Math.min(36,band-2));
    o.values.forEach((v,i)=>{if(!(v>0))return;const x=X(i)-bw/2,y=Y(v),r=Math.min(4,bw/2,y0-y);
      s+=`<path class="bar" pointer-events="none" d="M${x},${y0}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${y0}Z"/>`})}
  else{if(n>1)s+=`<polyline class="ln" pointer-events="none" points="${o.values.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
    o.values.forEach((v,i)=>s+=`<circle class="pt" pointer-events="none" cx="${X(i)}" cy="${Y(v)}" r="${n>40?0:4}"/>`)}
  s+='</svg><div class="tip" hidden></div>';
  s+=`<details><summary>表で見る</summary><div class="tw"><table><tbody>${o.labels.map((l,i)=>`<tr><td class="t">${esc(l)}</td><td class="r num">${esc(o.fmt(o.values[i]))}</td></tr>`).join('')}</tbody></table></div></details>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip');
  svg.onmousemove=e=>{const h=e.target.closest('.hit');svg.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));if(!h){tip.hidden=true;return}
    const i=+h.dataset.i;h.classList.add('hl');tip.innerHTML=`<b>${esc(o.fmt(o.values[i]))}</b>${esc(o.labels[i])}`;tip.hidden=false;
    tip.style.left=Math.min(W-90,Math.max(90,X(i)))+'px';tip.style.top=Math.max(44,Y(o.values[i])-8)+'px'};
  svg.onmouseleave=()=>{tip.hidden=true;svg.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'))}}

    <div class="row">
      <label class="f">種類<select name="type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}"${p.type===k?' selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f">状態<select name="status">${STATUSES.map(s=>`<option${p.status===s?' selected':''}>${s}</option>`).join('')}</select></label>
    </div>
    <div class="row">
      <label class="f">撮影日<input type="date" name="shootDate" value="${esc(p.shootDate)}"></label>
      <label class="f">編集日<input type="date" name="editDate" value="${esc(p.editDate)}"></label>
      <label class="f">投稿日<input type="date" name="postDate" value="${esc(p.postDate)}"></label>
    </div>
    <label class="f">メモ（自由記述）<textarea name="memo" placeholder="企画の内容、ゲーム名、サムネ案、参考URLなど自由に">${esc(p.memo)}</textarea></label>
    <fieldset><legend>振り返り（公開後に記入）</legend>
      <label class="f">良かった点<textarea name="good" style="min-height:56px">${esc(p.good)}</textarea></label>
      <label class="f">改善点<textarea name="improve" style="min-height:56px">${esc(p.improve)}</textarea></label>
    </fieldset>
    <div class="acts">${delBtn(id)}${meta(p)}<span class="sp"></span><button type="button" class="btn" data-act="close">キャンセル</button><button class="btn pri">保存</button></div>`,
    fd=>{const t=id?plan(id):{id:uid(),createdAt:nowIso()};if(!t)return;
      for(const k of['title','type','status','shootDate','editDate','postDate','memo','good','improve'])t[k]=(fd.get(k)||'').trim();
      stamp(t);if(!id)db.plans.push(t);save('plans',t)});
  $('#dlg').dataset.del='plans'}
function dlgVideoStat(id){
  const s=id?db.videoStats.find(x=>x.id===id):{date:today()};if(!s)return;
  const ps=[...db.plans].sort((a,b)=>(b.postDate||'')<(a.postDate||'')?-1:1);
  if(!ps.length){toast('先に「企画」タブで企画を作ってください');return}
  if(id&&!plan(s.planId))return;
  const f=(k,l,a='')=>`<label class="f">${l}<input name="${k}" type="number" inputmode="decimal" ${a} value="${esc(s[k]??'')}"></label>`;
  openDlg(`<h3>${readOnly?'動画の数字':id?'動画の数字を編集':'動画の数字を記録'}</h3>
    <div class="row" style="grid-template-columns:2fr 1fr">
      <label class="f">動画<select name="planId" required>${ps.map(p=>`<option value="${p.id}"${s.planId===p.id?' selected':''}>${esc(p.title)}（${TYPES[p.type]||'通常'}・${esc(p.status)}）</option>`).join('')}</select></label>
      <label class="f">記録日<input type="date" name="date" required value="${esc(s.date)}"></label>
    </div>
    <div class="row">${f('views','再生数','min="0"')}${f('likes','高評価','min="0"')}${f('comments','コメント数','min="0"')}</div>
    <div class="row">${f('retention','視聴維持率（%）','min="0" max="100" step="0.1"')}${f('ctr','CTR（%）','min="0" max="100" step="0.1"')}${f('impressions','インプレッション','min="0"')}</div>
    <div class="row">${f('subsDelta','登録者増減（減った場合はマイナス）')}</div>
    <p class="sub" style="margin:0">分からない項目は空欄のままで大丈夫です。</p>
    <div class="acts">${delBtn(id)}${meta(s)}<span class="sp"></span><button type="button" class="btn" data-act="close">キャンセル</button><button class="btn pri">保存</button></div>`,
    fd=>{const t=id?db.videoStats.find(x=>x.id===id):{id:uid()};if(!t)return;
      t.planId=fd.get('planId');t.date=fd.get('date');for(const k of['views','likes','comments','retention','ctr','impressions','subsDelta'])t[k]=nval(fd,k);
      stamp(t);if(!id)db.videoStats.push(t);save('videoStats',t)});
  $('#dlg').dataset.del='videoStats'}
function dlgChannel(id){
  const s=id?db.channelStats.find(x=>x.id===id):{date:today()};if(!s)return;
  openDlg(`<h3>${readOnly?'チャンネルの数字':id?'チャンネルの数字を編集':'チャンネルの数字を記録'}</h3>
    <div class="row">
      <label class="f">記録日<input type="date" name="date" required value="${esc(s.date)}"></label>
      <label class="f">登録者数<input type="number" name="subscribers" min="0" value="${esc(s.subscribers??'')}"></label>
      <label class="f">総再生数<input type="number" name="totalViews" min="0" value="${esc(s.totalViews??'')}"></label>
    </div>
    <div class="acts">${delBtn(id)}${meta(s)}<span class="sp"></span><button type="button" class="btn" data-act="close">キャンセル</button><button class="btn pri">保存</button></div>`,
    fd=>{const t=id?db.channelStats.find(x=>x.id===id):{id:uid()};if(!t)return;
      t.date=fd.get('date');t.subscribers=nval(fd,'subscribers');t.totalViews=nval(fd,'totalViews');
      stamp(t);if(!id)db.channelStats.push(t);save('channelStats',t)});
  $('#dlg').dataset.del='channelStats'}

/* ===== イベント ===== */
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){ui.view=v.dataset.view;try{location.hash=ui.view}catch(e){}render();window.scrollTo(0,0);return}
  const sg=e.target.closest('[data-seg]');if(sg){ui[sg.dataset.seg]=sg.dataset.val;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id;
  switch(a.dataset.act){
    case'close':$('#dlg').close();break;
    case'edit':readOnly?dlgEdit():exitEdit();break;
    case'plan':dlgPlan(id);break;case'plan-new':dlgPlan(null);break;
    case'vs':dlgVideoStat(id);break;case'vs-new':dlgVideoStat(null);break;
    case'ch':dlgChannel(id);break;case'ch-new':dlgChannel(null);break;
    case'cal':{const d=+a.dataset.d;if(!d){const n=new Date();ui.cal=[n.getFullYear(),n.getMonth()]}else{const n=new Date(ui.cal[0],ui.cal[1]+d,1);ui.cal=[n.getFullYear(),n.getMonth()]}render();break}
    case'del':{if(a.dataset.sure){const col=$('#dlg').dataset.del;remove(col,id);
        if(col==='plans')for(const s of db.videoStats.filter(s=>s.planId===id))remove('videoStats',s.id);
        $('#dlg').close();render()}
      else{a.dataset.sure='1';a.textContent=$('#dlg').dataset.del==='plans'?'もう一度押すと削除（この動画の数字も消えます）':'もう一度押すと削除'}break}
  }});
/* カンバンのドラッグ＆ドロップ */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.pc');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('dragend',()=>document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over')));
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');if(!c)return;e.preventDefault();c.classList.remove('over');
  const p=plan(e.dataTransfer.getData('text/plain'));if(readOnly)return;if(p&&p.status!==c.dataset.status){p.status=c.dataset.status;stamp(p);save('plans',p)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==ui.view&&!$('#hdr').hidden){ui.view=h;render()}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(ui.view==='an'&&!$('#hdr').hidden)drawAnalysis()},150)});

boot();
</script>
</body>
</html>
